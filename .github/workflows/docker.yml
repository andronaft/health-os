name: docker

# On every GitHub release: build + push the MCP server image to ghcr.io/andronaft/health-os,
# then publish the new version to the official MCP Registry (GitHub OIDC — no secrets).
# Started by hand, it only rebuilds the image (the registry rejects re-publishing a version).
# The version comes from pyproject.toml; server.json is updated from it here.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write   # MCP Registry login via GitHub OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version from pyproject.toml
        id: v
        run: echo "version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/andronaft/health-os:${{ steps.v.outputs.version }}
            ghcr.io/andronaft/health-os:latest

      - name: Smoke test — the server starts and lists its tools over stdio
        run: |
          docker run --rm -i -e DATABASE_URL=postgresql+psycopg://x:x@127.0.0.1:1/x \
            ghcr.io/andronaft/health-os:${{ steps.v.outputs.version }} \
            python -c "import asyncio; from mcp_server.server import mcp; n=len(asyncio.run(mcp.list_tools())); print(n, 'tools'); assert n >= 28"

      - name: Set version in server.json
        run: |
          V=${{ steps.v.outputs.version }}
          jq --arg v "$V" '.version = $v | .packages[0].identifier = "ghcr.io/andronaft/health-os:" + $v' \
            server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Publish to the MCP Registry
        if: github.event_name == 'release'
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
