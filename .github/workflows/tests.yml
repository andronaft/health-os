name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: health
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: health_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U health -d health_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # conftest.py redirects to <db>_test and recreates it (migrations + seed) on every run
      DATABASE_URL: postgresql+psycopg://health:ci_only_password@localhost:5432/health_os
      REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -q -m "not integration"

      - name: Integration tests
        run: python -m pytest -q -m integration -rs
