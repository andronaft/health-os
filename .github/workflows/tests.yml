name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv run --locked --extra dev ruff check .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # scan the whole history, not just the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: health
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: health_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U health -d health_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # conftest.py redirects to <db>_test and recreates it (migrations + seed) on every run
      DATABASE_URL: postgresql+psycopg://health:ci_only_password@localhost:5432/health_os
      REQUIRE_DB: "1"
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked --extra dev

      - name: Unit tests
        run: uv run python -m pytest -q -m "not integration" --cov --cov-report=

      - name: Integration tests
        run: uv run python -m pytest -q -m integration -rs --cov --cov-append --cov-report=

      - name: Coverage
        run: uv run coverage report --sort=cover --format=markdown | tee -a "$GITHUB_STEP_SUMMARY"
