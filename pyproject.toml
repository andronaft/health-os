[project]
name = "health-os"
version = "0.1.0"
description = "Local-first personal health record exposed over MCP"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "andronaft" }]
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "mcp>=1.2,<3",  # 2.x renamed FastMCP → MCPServer; migrate deliberately
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines are fine (SQL, docstrings); not worth mass reformatting

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
markers = ["integration: needs Postgres (the test DB is created automatically)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "seed"]

[tool.coverage.run]
source = ["core", "safety", "analytics", "ingestion", "mcp_server", "seed", "worker", "prompts"]
